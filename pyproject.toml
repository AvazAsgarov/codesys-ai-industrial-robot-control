[project]
name = "airc"
version = "0.3.0"
description = "AI Industrial Robot Control: services for a vision-guided, AI-supervised robotic sorting cell on a CODESYS soft-PLC."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Avaz Asgarov" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.8",
    "pyyaml>=6",
    "asyncua>=2.1,<3",
    "numpy>=2",
    "mujoco>=4.0,<5",
    "opencv-python>=4.10",
    "httpx>=0.28.1",
]

[project.scripts]
airc = "airc.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airc"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
    "types-PyYAML",
]

# Asset preparation only (tools/fetch_objects.py): uv sync --group assets
assets = [
    "trimesh>=4.4",
    "pillow>=10",
]

# Detectors (Phase 3): uv sync --group vision. CPU builds of torch (no NVIDIA GPU here).
vision = [
    "ultralytics>=8.4,<9",
    "openvino>=2026.4",
    "torch>=2.9",
    "torchvision>=0.24",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not codesys'"
markers = [
    "codesys: needs CODESYS Control Win on this machine (local only: pytest -m codesys)",
    "render: needs an OpenGL context (MuJoCo offscreen rendering)",
    "vision: needs the exported detectors (uv sync --group vision; airc vision export)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["plc/scripts"]  # CODESYS IronPython 2.7 scripts, not part of the package

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "PT", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004"]
"tests/plc/generators/**" = ["RUF005"]  # readable step sequences

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = ["plc/scripts"]
strict = ["src/airc"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
