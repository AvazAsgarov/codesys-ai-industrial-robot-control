# Phase 2 demo: parts of the three types flow on the belt; the PLC picks and sorts them by class.
name: p2_demo
seed: 42
duration_s: 300
bin_capacity: 30          # bins hold ~40 parts; a full bin suspends the cell (operator empties it)
spawn:
  pitch_mm: 1000         # one part per metre of belt (10 s at 100 mm/s): the pick cycle is ~9 s
  jitter_mm: 100
  mix: [1, 1, 1]         # Type A, B, C
  y_offset_mm: 50
  theta_deg: 30
